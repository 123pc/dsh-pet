<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude 工牌大肥鱼 · 动作图鉴</title>
<style>
 :root{font:14px/1.6 system-ui,sans-serif;color:#293b56;background:#f4f1e9;color-scheme:light}*{box-sizing:border-box}body{max-width:1180px;margin:30px auto;padding:0 24px}h1{margin:0;font-size:29px;letter-spacing:-.6px}h2{font-size:17px;margin:0}p{color:#68758a;margin:4px 0 20px}.eyebrow{color:#a57647;font-size:12px;letter-spacing:2px;font-weight:700}
 .bar,.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.bar{justify-content:space-between;margin-bottom:16px}.pill{border:1px solid #d8dbd7;border-radius:22px;background:#fffdf8;padding:6px 12px;font-size:12px}button,input,select{font:inherit}button{border:1px solid #d8dbd7;background:#fffdf8;color:inherit;padding:7px 12px;border-radius:8px;cursor:pointer}button:hover,button.selected{background:#dce9ec;border-color:#8dafbc}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e3b578;outline-offset:2px}.primary{background:#e9bb80;border-color:#ddb17a;color:#4f3928}
 .runway{height:300px;position:relative;overflow:hidden;border:1px solid #d7ddd9;border-radius:17px;background:linear-gradient(#e9f1f3 0%,#f4f5ef 87%,#dce1d7 87.5%,#eef0e6 88%)}.runway::before{content:'';position:absolute;left:20px;right:20px;bottom:35px;border-top:1px dashed #abbcb6}.walker{position:absolute;left:0;bottom:10px;width:400px;height:225px;will-change:transform}.walker video{width:100%;height:100%}.readout{position:absolute;left:18px;top:14px;font-size:12px;color:#60758c}.stage-note{position:absolute;right:18px;bottom:12px;color:#71816f;font-size:12px}
 .viewer{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:22px 0}article{border:1px solid #d8dedb;border-radius:15px;overflow:hidden;background:#fffdf8}article header{padding:13px 17px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e4e6df}video{display:block;width:100%;aspect-ratio:16/9;object-fit:contain}.checker{background-color:#e8eceb;background-image:linear-gradient(45deg,#d9dfdf 25%,transparent 25%),linear-gradient(-45deg,#d9dfdf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d9dfdf 75%),linear-gradient(-45deg,transparent 75%,#d9dfdf 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.dark .checker{background:#252d3c}.detail{padding:10px 17px;min-height:45px;color:#6b778a;font-size:12px}
 .tools{display:flex;gap:10px;margin:16px 0}select,input{padding:8px 11px;border-radius:8px;border:1px solid #ccd6d5;background:#fffdf8;color:inherit}input{flex:1;min-width:0}.catalogue{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:7px}.catalogue button{text-align:left;white-space:normal;font-size:12px;min-height:42px}.count{font-size:12px;color:#738092}footer{font-size:12px;color:#778194;margin:26px 0}#error{color:#a34d45}@media(max-width:760px){.viewer{grid-template-columns:1fr}.runway{height:250px}.walker{width:330px;height:186px}body{padding:0 14px}.catalogue{grid-template-columns:repeat(2,1fr)}}
</style>
<div class="bar"><div><div class="eyebrow">CLAUDE BADGE · DAFEIYU</div><h1>大肥鱼，今天也在认真摸鱼。</h1></div><span class="pill">0.3.0 · 完整动作库</span></div>
<div class="bar"><h2>真的走起来</h2><div class="controls"><button id="left" class="primary">向左走</button><button id="right">向右走</button><button id="pause">暂停散步</button></div></div>
<div class="runway" id="runway"><div class="readout" id="position">正在加载步态…</div><div class="walker" id="walker"><video id="walk" src="../animation/自然走路.webm?v=0.3.0" autoplay muted playsinline></video></div><span class="stage-note">到达终点后转身，继续散步</span></div>
<div class="viewer"><article><header><strong id="name">自然走路</strong><span id="group" class="count">移动</span></header><div class="checker"><video id="action" src="../animation/自然走路.webm?v=0.3.0" autoplay muted loop playsinline controls></video></div><div class="detail" id="detail">支撑脚落地、摆动脚抬起；此窗口展示动作本身。</div></article><article><header><strong>Claude·托腮</strong><button id="background">切换背景</button></header><div class="checker"><video src="../lean-animation/lean.webm?v=0.3.0" autoplay muted loop playsinline controls></video></div><div class="detail">独立的固定陪伴形态；完整动作和屏幕漫游由站立形态承担。</div></article></div>
<div class="bar"><h2>动作图鉴</h2><span id="count" class="count"></span></div>
<div class="tools"><select id="category" aria-label="动作分类"><option value="all">全部分类</option></select><input id="search" aria-label="搜索动作" placeholder="找一个动作，例如：吃白饭、写代码、舞狮头"></div>
<div id="error" role="status"></div><div class="catalogue" id="catalogue"></div>
<footer>已对照上游 106 个动作，另外增加自然走路。动作使用分层角色与独立道具演出；这里是素材与位移预览。实际桌宠请在 DSH 侧栏「Claude 动作」点播，或等待随机动作；拖拽抛掷由宿主物理系统处理。</footer>
<script>
const el=id=>document.getElementById(id),walk=el('walk'),action=el('action');
const labels={idle:'待机',turn:'转向',drag:'拖拽反馈',clicks:'点击回应',moves:'移动',balance:'余额六档',whisper:'碎碎念',workStatus:'工作状态六档'};
let direction=-1,origin=null,progress=0,actions=[],selected='自然走路';
function start(dir){direction=dir;origin=null;walk.currentTime=0;walk.play().catch(()=>{});el('pause').textContent='暂停散步';el('left').classList.toggle('primary',dir<0);el('right').classList.toggle('primary',dir>0)}
el('left').onclick=()=>start(-1);el('right').onclick=()=>start(1);
el('pause').onclick=()=>{if(walk.paused){walk.play();el('pause').textContent='暂停散步'}else{walk.pause();el('pause').textContent='继续散步'}};
walk.addEventListener('ended',()=>{const max=Math.max(0,el('runway').clientWidth-el('walker').getBoundingClientRect().width);const end=Math.max(0,Math.min(max,origin+direction*Math.min(220,max)));direction*=-1;origin=end;walk.currentTime=0;walk.play().catch(()=>{})});
function tick(){const box=el('runway'),width=el('walker').getBoundingClientRect().width,max=Math.max(0,box.clientWidth-width);
 if(origin===null)origin=direction<0?Math.min(max,Math.max(220,max*.7)):Math.max(0,max*.3-110);
 const duration=Number.isFinite(walk.duration)?walk.duration:5;progress=Math.max(0,Math.min(1,(walk.currentTime-.5)/Math.max(.1,duration-1)));
 const x=Math.max(0,Math.min(max,origin+direction*Math.min(220,max)*progress));el('walker').style.transform=`translateX(${x}px)`;walk.style.transform=direction>0?'scaleX(-1)':'';
 el('position').textContent=`${direction<0?'← 向左散步':'向右散步 →'} · 已移动 ${Math.round(Math.min(220,max)*progress)} px`;requestAnimationFrame(tick)}tick();
el('background').onclick=()=>document.body.classList.toggle('dark');
function select(row){selected=row.name;el('name').textContent=row.name;el('group').textContent=labels[row.group]||row.group;el('error').textContent='';action.src='../animation/'+encodeURIComponent(row.name)+'.webm?v=0.3.0';action.play().catch(()=>{});
 el('detail').textContent=row.group==='moves'?'这是原地步态素材；上方散步演示和 DSH 宿主负责屏幕位移。':row.group==='balance'?'余额消耗比例对应的专属档位动作。':row.group==='workStatus'?'随思考、工作、整理、等待、完成或错误状态触发。':'分层角色动作，配合独立道具与特效。';render()}
function render(){const group=el('category').value,term=el('search').value.trim(),visible=actions.filter(a=>(group==='all'||a.group===group)&&a.name.includes(term));el('count').textContent=`${visible.length} / ${actions.length} 个动作`;el('catalogue').replaceChildren(...visible.map(row=>{const b=document.createElement('button');b.textContent=row.name;b.classList.toggle('selected',selected===row.name);b.onclick=()=>select(row);return b}))}
el('category').onchange=render;el('search').oninput=render;
fetch('../sources/action-catalogue.json').then(r=>{if(!r.ok)throw Error('动作清单暂不可用');return r.json()}).then(data=>{actions=[{name:'自然走路',group:'moves'},...data.actions];[...new Set(actions.map(a=>a.group))].forEach(group=>{const o=document.createElement('option');o.value=group;o.textContent=labels[group]||group;el('category').append(o)});render()}).catch(e=>el('error').textContent=e.message);
action.addEventListener('error',()=>el('error').textContent='这个动作还未成功加载，请检查素材是否构建完成。');
</script>
</html>
