<!doctype html><html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude · 动作库</title>
<style>
:root{font:14px/1.65 system-ui,sans-serif;color:#293f55;background:#f5f2eb;color-scheme:light}*{box-sizing:border-box}body{max-width:1200px;margin:28px auto;padding:0 22px}h1{margin:0;font-size:29px}h2{font-size:17px;margin:0}p{color:#6a7885;margin:5px 0 16px}.bar,.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar{justify-content:space-between;margin-bottom:18px}.pill{border:1px solid #c3d6ce;border-radius:22px;padding:5px 12px;background:#e8f0e8;color:#46604d;font-size:12px}.viewers{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}article{background:#fffdf8;border:1px solid #d7dfda;border-radius:15px;overflow:hidden}header{padding:12px 16px;border-bottom:1px solid #e1e5de}.stage{background:#e9ece8;min-height:250px;position:relative}.stage video{width:100%;display:block;aspect-ratio:16/9}.dark .stage{background:#293444}.caption{padding:10px 16px;font-size:12px;color:#687b89}#empty{padding:75px 25px;text-align:center;color:#7c858c}#reference{display:block;width:100%;aspect-ratio:1280/760;object-fit:contain;background:#e9ece8}.tools{margin:20px 0}button,input,select{font:inherit;color:inherit;border:1px solid #bdcccd;border-radius:7px;background:#fffdf8;padding:7px 10px}button{cursor:pointer}button:hover,button.selected{border-color:#85a7b5;background:#e0ecee}input{flex:1;min-width:180px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d9ab70;outline-offset:2px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.card{padding:0;text-align:left;overflow:hidden;background:#fffdf8}.card img{width:100%;display:block;aspect-ratio:16/9;object-fit:contain;background:#e9ece8}.card .meta{padding:9px 11px}.card strong{font-size:13px;display:block}.card small{display:block;color:#71808c}.pending{opacity:.64}.placeholder{height:75px;display:grid;place-items:center;color:#8d9a9f;background:#eceee8;font-size:12px}#status{font-size:12px;color:#6c7c89}footer{margin:25px 0;font-size:12px;color:#7b858e}a{color:#526f89}.tag{font-size:12px;color:#9d7447}#error{color:#a34f42}@media(max-width:760px){body{padding:0 13px}.viewers{grid-template-columns:1fr}.stage{min-height:210px}.cards{grid-template-columns:repeat(2,1fr)}h1{font-size:25px}}
[hidden]{display:none!important}
</style>
<div class="bar"><div><span class="tag">CLAUDE BADGE · DAFEIYU</span><h1>完整人物动作库</h1></div><span class="pill" id="progress">正在读取进度…</span></div>
<p>走路已获认可。其余动作对照原项目视频逐项重制；“已检查”表示完成制作复核，“待复核”仍是样片。</p>
<p><a href="companion.html">新：托腮小动作、拿电脑办公与安静长待机 →</a></p>
<div class="viewers"><article><header><h2 id="name">自然走路</h2><span id="state" class="tag">用户已认可</span></header><div class="stage"><video id="player" autoplay muted loop playsinline controls src="../animation/自然走路.webm"></video><div id="empty" hidden>这个动作仍在制作中。</div></div><div class="caption bar"><span id="detail">完整人物关键帧，透明动画。</span><div><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="0.5">半速检查</option><option value="0.25">四分之一速</option></select><button id="background">切换背景</button></div></div></article>
<article><header><div class="bar" style="margin:0"><h2 id="reference-title">已认可的走路关键帧</h2><div><button id="original-mode">原动作参考</button><button id="frames-mode">新关键帧</button></div></div></header><img id="reference" src="keyframes-v5/contact.png" alt="原动作或关键帧参考"><div class="caption">其它动作显示原项目视频的四个时间点，用于核对姿势、道具与动作过程。<a href="keyframes.html">查看走路逐帧对照</a></div></article></div>
<div class="tools"><select id="group" aria-label="动作分类"><option value="all">全部分类</option></select><select id="filter" aria-label="制作状态"><option value="preview">可预览的动作</option><option value="ready">已检查 / 已认可</option><option value="all">全部（含待制作）</option><option value="pending">待制作</option></select><input id="search" aria-label="搜索动作" placeholder="搜索，例如：吃白饭、挥手、伸懒腰"><button id="refresh">刷新进度</button></div>
<div class="bar"><h2>动作清单</h2><span id="status"></span></div><div id="error" role="status"></div><div class="cards" id="cards"></div>
<footer>所有新动作均使用生成的完整人物图；没有分层纸片手臂或代码绘制的道具。已撤回的 107 个旧分层动作不会出现在这里。制作进度每 15 秒更新，当前播放保持不变。</footer>
<script>
const el=id=>document.getElementById(id),player=el('player');let data,selected='walk',media='',referenceMode='original',currentRow;
const labels={idle:'待机',turn:'转向',drag:'拖拽反馈',clicks:'点击回应',moves:'移动',balance:'余额六档',whisper:'碎碎念',workStatus:'工作状态六档',lean:'托腮与办公',quiet:'安静长待机'};
const ready=r=>['self-reviewed','user-approved'].includes(r.status),label=r=>r.status==='user-approved'?'用户已认可':r.status==='self-reviewed'?'已检查':r.preview?'待复核':'待制作';
function select(row){currentRow=row;selected=row.id;el('name').textContent=row.name;el('state').textContent=label(row);el('reference').src=referenceMode==='frames'?row.contact||row.reference:row.reference||row.contact;el('reference-title').textContent=referenceMode==='frames'?'新绘制的完整关键帧':row.reference?'原项目动作参考':'已认可的走路关键帧';el('original-mode').classList.toggle('selected',referenceMode==='original');el('frames-mode').classList.toggle('selected',referenceMode==='frames');el('empty').hidden=!!row.preview;player.hidden=!row.preview;
 if(row.preview){const url=row.preview+'?v='+(row.sheetSha256||'approved-walk').slice(0,12);if(url!==media){media=url;player.src=url;player.playbackRate=Number(el('speed').value);player.play().catch(()=>{})}}else{player.pause();media=''}
 el('detail').textContent=row.status==='user-approved'?'走路已获用户认可，使用原八帧。':row.preview?`${row.frames} 张完整关键帧 · ${row.duration||''} 秒 · ${label(row)}`:'尚未制作，不会使用旧分层素材顶替。';render()}
function render(){if(!data)return;const term=el('search').value.trim(),group=el('group').value,filter=el('filter').value;const rows=data.actions.filter(r=>(group==='all'||r.group===group)&&r.name.includes(term)&&(filter==='all'||filter==='preview'&&r.preview||filter==='ready'&&ready(r)||filter==='pending'&&!r.preview));el('status').textContent=`显示 ${rows.length} 个 / 上游剩余 ${data.pending} 个`;el('cards').replaceChildren(...rows.map(row=>{const button=document.createElement('button');button.className='card'+(selected===row.id?' selected':'')+(!row.preview?' pending':'');if(row.preview){const image=document.createElement('img');image.alt=row.name;image.loading='lazy';image.src=row.id==='walk'?'keyframes-v5/frame-01.png':'actions/'+row.id+'/frame-01.png?v='+(row.sheetSha256||'').slice(0,12);button.append(image)}else{const p=document.createElement('div');p.className='placeholder';p.textContent='待制作';button.append(p)}const meta=document.createElement('div');meta.className='meta';const name=document.createElement('strong');name.textContent=row.name;const status=document.createElement('small');status.textContent=(labels[row.group]||row.group)+' · '+label(row);meta.append(name,status);button.append(meta);button.onclick=()=>select(row);return button}))}
async function refresh(){try{const response=await fetch('actions-index.json',{cache:'no-store'});if(!response.ok)throw Error('动作清单正在构建，请稍后刷新。');const next=await response.json(),groups=[...new Set(next.actions.map(r=>r.group))];if(!data){for(const group of groups){const option=document.createElement('option');option.value=group;option.textContent=labels[group]||group;el('group').append(option)}}data=next;el('progress').textContent=`走路已认可 · 其它动作 ${data.reviewed} / ${data.upstreamTotal} 已检查`;el('error').textContent='';const current=data.actions.find(r=>r.id===selected)||data.actions[0];select(current)}catch(e){el('error').textContent=e.message}}
el('original-mode').onclick=()=>{referenceMode='original';if(currentRow)select(currentRow)};el('frames-mode').onclick=()=>{referenceMode='frames';if(currentRow)select(currentRow)};
el('speed').onchange=()=>player.playbackRate=Number(el('speed').value);el('background').onclick=()=>document.body.classList.toggle('dark');el('search').oninput=render;el('group').onchange=render;el('filter').onchange=render;el('refresh').onclick=refresh;refresh();setInterval(refresh,15000);
player.addEventListener('error',()=>el('error').textContent='动画加载失败，请刷新进度后重试。');
</script></html>
